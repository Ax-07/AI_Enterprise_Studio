name: Command Center tests
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, 'feature/v0.5.1-acquisition', 'feature/v3.0.0-campus']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AI_Enterprise_Studio_V03
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -v
      - name: Static repository inventory (committed public-source paths)
        run: python audit_repository.py --summary --output "$RUNNER_TEMP/aes-repository-inventory.json"
      - name: Upload static inventory
        uses: actions/upload-artifact@v4
        with:
          name: aes-repository-inventory
          path: ${{ runner.temp }}/aes-repository-inventory.json
          if-no-files-found: error
          retention-days: 14
      - name: JavaScript syntax
        run: |
          python -c "from pathlib import Path; s=Path('index.html').read_text(encoding='utf8'); Path('/tmp/enterprise-ui.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0], encoding='utf8')"
          node --check /tmp/enterprise-ui.js
          node --check interface/design.js
          node --check interface/campus-registry.js
          node --check interface/live.js
          node --check interface/live-layout.js
          node --check interface/live-teams.js
          node --check interface/live-art.js
          node --check interface/original-office.js
          node --check interface/original-rooms.js
          node --check interface/live-modules.js
          node --check interface/live-tools.js
          node --check interface/live-commands.js
          node smoke_n8n_contracts.js

      - name: Install Chromium test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Chromium smoke (no external API)
        run: python smoke_ui.py
      - name: Chromium campus (local fixtures, no paid API)
        env:
          AES_CAMPUS_SCREENSHOTS: ${{ runner.temp }}/aes-campus-visual
        run: python smoke_campus.py
      - name: Upload campus visual evidence (fixture only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-22.6-visual-check
          path: ${{ runner.temp }}/aes-campus-visual/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Verify preserved V2 tree
        run: test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD:AI_Enterprise_Studio_V02)" = "26562e73d6871837216290f0fa51acc539de3013"
      - name: Offline upgrade from stable main snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/aes-stable"
          git -C "$GITHUB_WORKSPACE" archive 3dbfe4c382e9008d54e6f3df8db14cd1299b1218 AI_Enterprise_Studio_V02 | tar -x -C "$RUNNER_TEMP/aes-stable"
          python -I -c "import sys; sys.path.insert(0,sys.argv[1]); import serveur as s; s.init(); c=s.db(); db=c.__enter__(); mid=db.execute(\"INSERT INTO missions(title,mode,state,engine) VALUES('historical fixture','cloud','terminée','dynamic')\").lastrowid; db.execute(\"INSERT INTO ledger(mission,model,reserved,actual,state) VALUES(?,'test',1000,500,'mesuré')\",(mid,)); c.__exit__(None,None,None)" "$RUNNER_TEMP/aes-stable/AI_Enterprise_Studio_V02"
          python build_candidate.py "$RUNNER_TEMP/AI_Enterprise_Studio_V03.zip"
          python -m zipfile -e "$RUNNER_TEMP/AI_Enterprise_Studio_V03.zip" "$RUNNER_TEMP/aes-package"
          python "$RUNNER_TEMP/aes-package/AI_Enterprise_Studio_V03/prepare_update.py" --source "$RUNNER_TEMP/aes-stable/AI_Enterprise_Studio_V02" --destination "$RUNNER_TEMP/AI_Enterprise_Studio_V03" --confirm-offline
          python -c "import json,sys; from pathlib import Path; r=json.loads(Path(sys.argv[1]).read_text()); assert r['protected_tables']['ledger']==1 and not r['started']" "$RUNNER_TEMP/AI_Enterprise_Studio_V03/PREPARATION.json"
      - name: Upload candidate package (public source only)
        uses: actions/upload-artifact@v4
        with:
          name: AI-Enterprise-Studio-V3.0.0
          path: ${{ runner.temp }}/AI_Enterprise_Studio_V03.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build optional HTML sandbox
        run: docker build -t aes-verifier:0.3.0 sandbox
      - name: Functional sandbox test
        run: python smoke_sandbox.py

      - name: Build laboratory sandbox
        run: docker tag aes-verifier:0.3.0 aes-lab:0.3.8
      - name: Laboratory real browser benchmark
        run: python smoke_laboratory.py
      - name: Design patch against exact V3.0.0 files
        run: |
          mkdir -p "$RUNNER_TEMP/aes-design-baseline"
          git -C "$GITHUB_WORKSPACE" archive f97478171bc865fdfa156b25090cc5a61e3615e6 AI_Enterprise_Studio_V03 | tar -x -C "$RUNNER_TEMP/aes-design-baseline"
          target="$RUNNER_TEMP/aes-design-baseline/AI_Enterprise_Studio_V03"
          cp -r "$RUNNER_TEMP/AI_Enterprise_Studio_V03/donnees" "$target/"
          cp "$RUNNER_TEMP/AI_Enterprise_Studio_V03/PREPARATION.json" "$target/"
          printf '{"fixture":"private-local-config"}' > "$target/config.json"
          sha256sum "$target/donnees/enterprise.sqlite3" "$target/config.json" "$target/PREPARATION.json" > "$RUNNER_TEMP/design-private.sha256"
          python build_design_patch.py "$RUNNER_TEMP/AI_Enterprise_Studio_V3.0.1_Design.zip"
          python -m zipfile -e "$RUNNER_TEMP/AI_Enterprise_Studio_V3.0.1_Design.zip" "$RUNNER_TEMP/design-patch"
          python "$RUNNER_TEMP/design-patch/apply_design_patch.py" --target "$target" --confirm-offline
          sha256sum -c "$RUNNER_TEMP/design-private.sha256"
          python "$RUNNER_TEMP/design-patch/apply_design_patch.py" --target "$target" --confirm-offline --restore
          sha256sum -c "$RUNNER_TEMP/design-private.sha256"
          test ! -f "$target/interface/original.html"
      - name: Upload tested design patch
        uses: actions/upload-artifact@v4
        with:
          name: AI-Enterprise-Studio-V3.0.1-Design
          path: ${{ runner.temp }}/AI_Enterprise_Studio_V3.0.1_Design.zip
          if-no-files-found: error
          retention-days: 14


  n8n-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AI_Enterprise_Studio_V03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: n8n isolated real workflow integration
        run: python smoke_n8n_real.py

  worldbank-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    defaults:
      run:
        working-directory: AI_Enterprise_Studio_V03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: World Bank public API (network availability reported separately)
        run: python smoke_worldbank_live.py

